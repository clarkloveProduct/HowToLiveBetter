# 正文更新后构建四种电子书；只有原仓库 main 分支更新固定 Release。
name: 电子书

on:
  push:
    branches: [main]
    paths:
      - README.md
      - index.html
      - selfcheck.html
      - og.png
      - ads/**
      - book/**
      - docs/*.md
      - tools/**
      - .github/workflows/book.yml
  pull_request:
    paths:
      - README.md
      - index.html
      - selfcheck.html
      - og.png
      - ads/**
      - book/**
      - docs/*.md
      - tools/**
      - .github/workflows/book.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: book-${{ github.ref }}
  cancel-in-progress: true

env:
  PANDOC_VERSION: '3.11'
  TYPST_VERSION: '0.15.1'

jobs:
  refs:
    name: 交叉引用检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tools/check-refs.mjs --check

  plain:
    name: 说人话检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tools/check-plain.mjs

  split:
    name: 拆分规则一致性检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tools/check-split.mjs

  stats:
    name: 统计数字检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tools/sync-stats.mjs --check
      - run: node tools/updates.mjs --check

  selfcheck:
    name: 自查条件检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tools/check-selfcheck.mjs

  build:
    name: 构建并发布电子书
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tools/epub/package-lock.json

      - name: 安装 EPUB 依赖
        run: npm ci
        working-directory: tools/epub

      - name: EPUB
        run: node tools/epub/build.mjs

      - name: 离线单文件 HTML
        run: node tools/offline/build.mjs

      - name: Anki 牌组
        run: node tools/anki/build.mjs

      - name: 安装 Pandoc、Typst 和中文字体
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk fontconfig
          sudo fc-cache -f
          curl -fLsS "https://github.com/jgm/pandoc/releases/download/${PANDOC_VERSION}/pandoc-${PANDOC_VERSION}-linux-amd64.tar.gz" | tar xz
          curl -fLsS "https://github.com/typst/typst/releases/download/v${TYPST_VERSION}/typst-x86_64-unknown-linux-musl.tar.xz" | tar xJ
          echo "$PWD/pandoc-${PANDOC_VERSION}/bin" >> "$GITHUB_PATH"
          echo "$PWD/typst-x86_64-unknown-linux-musl" >> "$GITHUB_PATH"

      - name: PDF
        run: |
          typst fonts | grep -i -E 'noto (serif|sans) cjk'
          node tools/pdf/build.mjs

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 校验 EPUB
        run: |
          curl -fLsS -o epubcheck.zip https://github.com/w3c/epubcheck/releases/download/v5.4.0/epubcheck-5.4.0.zip
          unzip -q epubcheck.zip
          java -jar epubcheck-5.4.0/epubcheck.jar dist/HowToLiveBetter.epub

      - name: 上传四种产物
        uses: actions/upload-artifact@v4
        with:
          name: HowToLiveBetter
          if-no-files-found: error
          retention-days: 30
          path: |
            dist/HowToLiveBetter.epub
            dist/HowToLiveBetter.pdf
            dist/HowToLiveBetter.html
            dist/HowToLiveBetter.apkg

      # Fork 仓库仅生成 Artifact，避免把发行文件发布到不预期的仓库。
      - name: 发布到原仓库 Release epub-latest
        if: github.event_name != 'pull_request' && github.repository == 'eternity4719/HowToLiveBetter' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag -f epub-latest
          git push -f origin epub-latest
          notes="正文提交 ${GITHUB_SHA::7}。EPUB、PDF、离线单文件 HTML、Anki 牌组；在线阅读与更新：https://renshengzhinan.co/"
          if gh release view epub-latest >/dev/null 2>&1; then
            gh release edit epub-latest --title "电子书（EPUB / PDF / 离线 HTML / Anki，自动更新）" --notes "$notes"
          else
            gh release create epub-latest --title "电子书（EPUB / PDF / 离线 HTML / Anki，自动更新）" --notes "$notes" --latest=false
          fi
          gh release upload epub-latest \
            dist/HowToLiveBetter.epub \
            dist/HowToLiveBetter.pdf \
            dist/HowToLiveBetter.html \
            dist/HowToLiveBetter.apkg --clobber
