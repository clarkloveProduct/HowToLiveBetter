name: Build HowToLiveBetter Book Artifacts

on:
  push:
    branches: [ main ]
  workflow_dispatch: # 支持网页手动点击运行工作流

jobs:
  build:
    runs-on: ubuntu‑latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch‑depth: 0

      - name: Setup Node.js
        uses: actions/setup‑node@v4
        with:
          node‑version: "22"

      - name: Install system deps (pandoc, typst)
        run: |
          sudo apt‑get update
          sudo apt‑get install‑y pandoc
          # 安装 typst >=0.13
          curl‑fsSL https://typst.app/install | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install epub tool dependencies
        run: npm --prefix tools/epub ci

      - name: Build offline HTML
        run: node tools/offline/build.mjs

      - name: Build PDF
        run: node tools/pdf/build.mjs

      - name: Build Anki deck (optional)
        run: node tools/anki/build.mjs

      - name: Upload build artifacts
        uses: actions/upload‑artifact@v4
        with:
          name: book‑output
          path: dist/
          retention‑days: 30
